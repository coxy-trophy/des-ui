[package]
name = "des-ui"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "The DEs-UI shell: a sci-fi terminal desktop"

[dependencies]
base64 = "0.22"
anyhow = "1.0.104"
zbus = "5"
async-channel = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "accesskit"] }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.38.4"
vt100 = "0.16.2"
des-common = { path = "../common" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
tempfile = "3"
rustix = { version = "1", features = ["fs", "process", "net"] }

[[bin]]
name = "des-ui"
path = "src/main.rs"

[[bin]]
name = "des-ui-ctl"
path = "src/bin/des-ui-ctl.rs"

[dev-dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

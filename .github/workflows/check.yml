name: Desktop checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libinput-dev libgbm-dev libseat-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test all desktop components
        run: cargo test --workspace --locked -- --include-ignored
      - name: Check all targets
        run: cargo clippy --workspace --all-targets --locked
      - name: Check packaging and session scripts
        run: |
          find . -maxdepth 2 -name '*.sh' -exec sh -n {} \;
          for script in session/des-ui-session session/des-ui-greeter packaging/des-ui-login packaging/des-ui-*/post* packaging/des-ui-*/prerm; do
            sh -n "$script"
          done

[package]
name = "des-connect"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native DES Connect protocol and session foundations"

[dependencies]
base64 = "0.22"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

openssl = "0.10.81"
rustix = { version = "1", features = ["process", "net", "fs"] }

zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "des-connectd"
path = "src/bin/des-connectd.rs"

[[bin]]
name = "des-connect-ctl"
path = "src/bin/des-connect-ctl.rs"
